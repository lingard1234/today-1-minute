name: 앱인토스 자동 배포

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'granite.config.ts'
      - 'index.html'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 앱 빌드
        run: npm run build

      - name: 앱인토스 배포
        run: |
          # ait 배포 메모는 120자 제한이 있어, 커밋 제목(첫 줄)만 100자로 잘라서 사용해요.
          MEMO="자동 배포 — $(git log -1 --pretty=%s | cut -c1-100)"
          npx ait deploy --api-key "${{ secrets.AIT_API_KEY }}" -m "$MEMO"
