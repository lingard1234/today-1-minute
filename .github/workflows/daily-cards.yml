name: 하루1분 카드 자동 생성 (멤버십)

# 매일 07:01 KST(=22:01 UTC 전날)에 Claude Code가 오늘의 실제 뉴스로 카드를 만들고,
# 워크플로가 커밋→빌드→앱인토스 배포까지 처리해요.
# 인증은 API 키가 아니라 Claude Pro/Max "구독 토큰"(CLAUDE_CODE_OAUTH_TOKEN)을 써서
# 종량제 API 과금이 발생하지 않아요. (멤버십 사용량에서만 차감)

on:
  schedule:
    - cron: "1 22 * * *"   # 07:01 KST
  workflow_dispatch:        # 콘솔/CLI에서 수동 실행(테스트)

permissions:
  contents: write
  id-token: write   # claude-code-action이 OIDC 토큰 발급에 필요

concurrency:
  group: daily-cards
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul   # date 명령이 KST를 반환하도록
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 카드 생성 (Claude Code, 구독 토큰)
        uses: anthropics/claude-code-action@v1
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}   # 기본 토큰 사용 → Claude GitHub App 설치 불필요
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,WebSearch,WebFetch"
            --max-turns 120
          prompt: |
            너는 "하루1분" 카드 뉴스 미니앱의 오늘자 카드를 만드는 자동화야.
            사람 검수 없이 끝까지 자동으로 완료해야 해. **파일 편집까지만 하고, git 커밋·push·배포는 절대 하지 마.** (그건 이후 워크플로 단계가 처리해.)

            ## 0. 오늘 날짜
            먼저 `date '+%Y-%m-%d'`로 오늘 날짜(KST 기준)를 확인해. 이 날짜를 아래에서 계속 사용해.

            ## 1. 오늘의 실제 뉴스 찾기
            WebSearch로 오늘 날짜 기준 한국의 실제 뉴스를 찾아. 아래 카테고리 중 3~4개를 골라 (날씨, 경제, IT, 사회, 문화, 스포츠). 매일 조합이 겹치지 않게 다양하게. 추측·가상 내용은 절대 금지.

            ### 1-1. 날짜 검증 (가장 중요)
            검색 결과에는 며칠~몇 년 전 기사가 섞여 들어와. 제목이 그럴듯하다고 바로 쓰면 안 돼.
            - 카드로 쓸 기사는 **보도 날짜를 반드시 확인**해. 검색 결과 스니펫에 날짜가 안 보이면 WebFetch로 열어서 확인해.
            - **오늘 또는 어제 일어난 일만** 카드로 써. 이틀 이상 지난 사건은 버려.
            - 예외: 오늘부터 시행·개막·출시되는 건은 며칠 전 예고 보도여도 괜찮아 (오늘이 시행일이니까).
            - 본문에 "지난 30일", "지난주" 같은 과거 시점 표현을 쓰게 된다면, 그건 오늘 뉴스가 아니라는 신호야. 그 카드는 빼.

            ### 1-2. 사실 확인
            - WebSearch 요약만 믿지 마. 카드로 쓸 기사는 **WebFetch로 원문을 최소 1건 열어** 숫자와 고유명사를 직접 확인해.
            - 숫자(지수 종가, 기온, 가격, 인원, 등수)는 **서로 다른 출처 2곳에서 일치할 때만** 써. 안 맞으면 그 숫자를 빼고 서술해.
            - 확인 못 한 수치·고유명사·직함은 아예 쓰지 마. **틀린 카드 4장보다 확실한 카드 2장이 훨씬 나아.**
            - 오늘 마땅한 뉴스가 없는 카테고리는 그냥 건너뛰어. 억지로 채우지 마.

            ### 1-2-1. "최초·N번째·N년 만" 같은 기록 주장 (특히 조심)
            이건 오늘 기사만 봐서는 검증이 안 돼. **과거 사례를 따로 검색해서 확인하기 전엔 쓰지 마.**
            - "여성으로는 처음", "역대 두 번째", "리그 사상 첫" 같은 문구를 쓰려면 **그 분야의 과거 사례를 별도로 WebSearch해서** 정말 앞선 사례가 없는지 확인해.
            - 기사가 그렇게 썼더라도 그대로 믿지 마. 기사는 종종 범위를 생략해(예: "한국계 여성 최초"를 "여성 최초"로 줄여 씀).
            - 수식 범위를 정확히 붙여. "여성으로는 처음"과 "한국계 여성으로는 처음"은 완전히 다른 주장이야.
            - 확인이 안 되면 **그 문장을 통째로 빼.** 기록 주장 없이도 카드는 충분히 성립해.

            ### 1-3. 중복 방지
            먼저 src/data/cards.json 상단에서 **최근 7일치 카드의 title을 읽어**. 같은 사건을 다시 카드로 만들지 마. 후속 보도라면 새로운 사실이 있을 때만, 그 새 내용 중심으로 써.

            ## 2. 카드 작성 (하루1분 톤)
            각 뉴스마다:
            - title: 이미지 위 굵은 헤드라인. 최대 2줄, 줄바꿈은 \n. 15자 내외, 숫자·핵심 키워드 앞세우고 과장·낚시성 금지.
            - summary: 상세 본문. 3~4개 문단, 각 3~5문장, 문단 구분은 \n\n. 존댓말(해요체)로 담백하게, 원문 사실 근거로만. 배경→핵심사실→의미·영향→독자관점 순.
            - category: 위에서 고른 카테고리.
            - source: 실제 참고한 언론사/기관명. (화면에 "출처: OOO"로 노출돼)
            정치·사건 카드는 중립적·사실 위주로 작성해(특정 입장 옹호 금지). 기존 카드 톤은 src/data/cards.json 상단 항목들을 참고해.

            **숫자 서술 규칙:** 가격·요금·지수가 바뀐 걸 쓸 땐 **변동폭과 결과값을 반드시 둘 다** 적어. "9.1% 내렸어요"로 끝내지 말고 "9.1% 내려 kWh당 OOO원이 됐어요"까지 써. 변동폭만 적으면 독자가 그 숫자를 최종 가격으로 오해해. 같은 카드 안에서 항목마다 서술 방식이 달라지지 않게 통일해.

            ## 3. 관련 실사 사진 (Pexels)
            환경변수 PEXELS_API_KEY 를 사용해. 각 카드의 구체적 주제에 맞는 영어 키워드 2~3개로 https://api.pexels.com/v1/search 에 Authorization 헤더로 키를 넣어 GET (query, per_page=1, orientation=portrait). 응답 photos[0].src.large 를 imageUrl로 사용. 실패/결과없으면 imageUrl은 빈 문자열.
            (키가 비어있으면 이 단계는 건너뛰고 imageUrl 빈 문자열로 둬 — 앱이 카테고리 아트로 대체해.)

            ## 4. 자가 점검 (건너뛰지 마 — 파일 쓰기 전에 해)
            아직 파일에 쓰지 마. 만든 카드를 하나씩 다시 읽고 확인해:
            1. 이 사건이 오늘/어제 일인가? 이틀 이상 지난 건 아닌가?
            2. 본문의 모든 숫자를 실제 출처에서 확인했나? 확인 못 한 숫자가 남아있진 않나?
            3. 최근 7일 카드와 같은 사건은 아닌가?
            4. 수치가 바뀐 걸 썼다면 결과값이 들어있나?
            5. 지어낸 고유명사·직함·인용은 없나?
            6. "최초·N번째·N년 만" 문구가 있다면, 과거 사례를 따로 검색해 확인했나? 수식 범위가 정확한가?

            하나라도 걸리면 그 카드를 고치거나 빼. **카드가 2장만 남아도 괜찮아 — 정확도가 개수보다 훨씬 중요해.**

            ## 5. 발행 (파일 편집만)
            점검을 통과한 카드만 가지고 src/data/cards.json 을 읽어서:
            - 오늘 날짜(YYYY-MM-DD)로 id를 "{YYYYMMDD}-01","{YYYYMMDD}-02"... 순번(이미 오늘 카드 있으면 그 다음 번호부터).
            - 각 카드: { id, date, category, title, summary, imageUrl, source } (imageUrl 빈 문자열이면 필드 자체 생략).
            - 기존 배열에 추가하고 date 기준 내림차순 정렬 후 JSON.stringify(cards, null, 2) + "\n" 형식으로 다시 저장.
            - id 중복 없는지 반드시 확인. JSON 파싱 오류 없게 검증.

            ## 6. 마무리
            src/data/cards.json 저장까지만 하고 끝내. 커밋/배포는 하지 마. 몇 개를 어떤 카테고리로 만들었는지, 그리고 검증 과정에서 뺀 카드가 있으면 그 이유를 한두 줄로 보고해.

      - name: 변경분 커밋 & push
        id: commit
        run: |
          if git diff --quiet -- src/data/cards.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "cards.json 변경 없음 — 스킵"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/cards.json
          git commit -m "카드 뉴스 자동 업데이트 — $(date '+%Y-%m-%d')"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Node 설정
        if: steps.commit.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 의존성 설치
        if: steps.commit.outputs.changed == 'true'
        run: npm ci

      - name: 앱 빌드
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: 앱인토스 배포
        if: steps.commit.outputs.changed == 'true'
        run: |
          MEMO="자동 배포 — $(git log -1 --pretty=%s | cut -c1-100)"
          npx ait deploy --api-key "${{ secrets.AIT_API_KEY }}" -m "$MEMO"
